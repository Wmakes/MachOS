# Limine configuration for a disk MachOS was installed on
timeout: 3

/MachOS
    protocol: limine
    path: boot():/boot/kernel.elf
    module_path: boot():/boot/initrd.tar

/MachOS (rescue: runs from memory, so the disk can be checked)
    protocol: limine
    path: boot():/boot/kernel.elf
    module_path: boot():/boot/initrd.tar
    cmdline: rescue
