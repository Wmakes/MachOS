# the programs in MachOS's /bin. built on their own, against the SDK;
# tools/programs.sh keeps the [artifact.*] tables in step with src/bin
[project]
id = "userland"
version = "0.1.0"
mach = "^6.10"
src = "src"
out = "out/{target.name}/{profile.name}"

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = false
float_reassoc = false

# a MachOS program: a static x86_64 ELF linked at 4 MiB
[target.machos]
isa  = "x86_64"
os   = "freestanding"
abi  = "sysv64"
of   = "elf"
base = 0x400000

[dep.sdk]
path = "../sdk"

# programs (generated by tools/programs.sh)

[artifact.cat]
kind = "bin"
entry = "bin/cat.mach"
out = "bin/cat"
targets = ["machos"]
link = []
need = []

