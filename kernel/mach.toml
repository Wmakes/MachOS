[project]
id = "machos"
version = "0.9.1"
mach = "^6.10"
src = "src"
out = "out/{target.name}/{profile.name}"

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = false
float_reassoc = false

[target.kernel]
isa  = "x86_64"
os   = "freestanding"
abi  = "sysv64"
of   = "elf"
base = 0xffffffff80000000

[artifact.kernel]
kind = "bin"
entry = "main.mach"
out = "kernel.elf"
targets = ["kernel"]
link = []
need = []

[dep.sdk]
path = "../sdk"

# host tests exercise the driver contract without touching PCI hardware.
[target.host]
isa = "x86_64"
os = "linux"
abi = "sysv64"
of = "elf"

[artifact.ethernet-tests]
kind = "bin"
entry = "tests/ethernet.mach"
out = "ethernet-tests"
targets = ["host"]
link = []
need = []

[artifact.memory-tests]
kind = "bin"
entry = "tests/memory.mach"
out = "memory-tests"
targets = ["host"]
link = []
need = []

# syscall regressions execute in MachOS through the indexed test dispatcher.
[target.machos]
isa = "x86_64"
os = "freestanding"
abi = "sysv64"
of = "elf"
base = 0x400000
platform = "machos"

[artifact.socket-tests]
kind = "bin"
entry = "tests/sockets.mach"
out = "socket-tests"
targets = ["machos"]
link = []
need = []
