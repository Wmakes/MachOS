# mach's standard library on MachOS, checked: run by tools/test.py (it
# builds this and copies it onto the test disk); prints "ok NAME" or
# "FAIL NAME", then "stdtest: N failures"
[project]
id = "stdtest"
version = "0.1.0"
mach = "^6.10"
src = "src"
out = "out/{target.name}/{profile.name}"

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = false
float_reassoc = false

# a MachOS program: a static x86_64 ELF linked at 4 MiB. `platform` is what
# selects std's MachOS layer
[target.machos]
isa      = "x86_64"
os       = "freestanding"
abi      = "sysv64"
of       = "elf"
base     = 0x400000
platform = "machos"

[artifact.stdtest]
kind = "bin"
entry = "main.mach"
out = "stdtest"
targets = ["machos"]
link = []
need = []

# std with its MachOS layer, until mach-std has a way to add one from outside
[dep.std]
path = "../../deps/machos-std"

# runs a mach test dispatcher (mach test -o) once per test index, each in its
# own process with a time limit: std's own tests on MachOS
[artifact.runtests]
kind = "bin"
entry = "runtests.mach"
out = "runtests"
targets = ["machos"]
link = []
need = []

# std's own tests, run inside MachOS by the per-process dispatcher runner.
[artifact.stdsuite]
kind = "bin"
entry = "suite.mach"
out = "stdsuite"
targets = ["machos"]
link = []
need = []
