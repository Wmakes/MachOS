# MachOS's settings, read at every boot. one "key value" per line; a line
# starting with # is a comment. change a value and reboot.

# the machine's name (uname -n, the login prompt)
hostname machos

# the time zone, as a POSIX TZ rule: the zone's name, how far behind UTC it
# is, and when summer time starts and ends. some:
#   UTC0                              UTC
#   GMT0BST,M3.5.0/1,M10.5.0          London
#   CET-1CEST,M3.5.0,M10.5.0/3        Berlin, Paris, Warsaw, Rome, Madrid
#   EET-2EEST,M3.5.0/3,M10.5.0/4      Helsinki, Kyiv, Athens
#   EST5EDT,M3.2.0,M11.1.0            New York
#   CST6CDT,M3.2.0,M11.1.0            Chicago
#   PST8PDT,M3.2.0,M11.1.0            Los Angeles
#   JST-9                             Tokyo
#   AEST-10AEDT,M10.1.0,M4.1.0/3      Sydney
timezone UTC0

# what the hardware clock keeps: utc, or local (as Windows does it; use
# local when this machine also runs Windows)
rtc utc

# how many terminals get a login prompt (1 to 6; alt+F1..F6)
ttys 6

# a user to log in on tty1 without a password (empty: nobody)
autologin

# the network: dhcp (ask the network for an address), off, or an address
# set by hand: "IP/PREFIX GATEWAY DNS", like 192.168.1.20/24 192.168.1.1 1.1.1.1
network dhcp
