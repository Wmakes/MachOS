[project]
id = "machos"
version = "0.2.2"
mach = "^6.10"
src = "src"
out = "out/{target.name}/{profile.name}"

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = false
float_reassoc = false

[target.kernel]
isa  = "x86_64"
os   = "freestanding"
abi  = "sysv64"
of   = "elf"
base = 0xffffffff80000000

[artifact.kernel]
kind = "bin"
entry = "main.mach"
out = "kernel.elf"
targets = ["kernel"]
link = []
need = []

[dep.sdk]
path = "../sdk"
