# machboot, the MachOS boot loader. `machboot` changes this file (or edit
# it with nano). entries are numbered from 1 in the order written here
timeout 3
default 1

entry MachOS
    kernel  /boot/kernel.elf
    initrd  /boot/initrd.tar
    cmdline

entry MachOS (rescue)
    help    runs from memory, so the disk can be checked
    kernel  /boot/kernel.elf
    initrd  /boot/initrd.tar
    cmdline rescue

entry MachOS (verbose)
    help    every kernel message on the screen
    kernel  /boot/kernel.elf
    initrd  /boot/initrd.tar
    cmdline debug
