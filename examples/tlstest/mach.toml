# Upstream TLS and protocol tests cross-built as static MachOS executables.
[project]
id = "tlstest"
version = "0.1.0"
mach = "^6.10"
src = "src"
out = "out/{target.name}/{profile.name}"

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = false
float_reassoc = false

# a MachOS program: a static x86_64 ELF linked at 4 MiB. `platform` is what
# selects std's MachOS layer
[target.machos]
isa      = "x86_64"
os       = "freestanding"
abi      = "sysv64"
of       = "elf"
base     = 0x400000
platform = "machos"

[artifact.tlstest]
kind = "bin"
entry = "main.mach"
out = "tlstest"
targets = ["*"]
link = []
need = []

[dep.std]
path = "../../deps/machos-std"

[dep.crypto]
path = "../../deps/mach-crypto"

[dep.pki]
path = "../../deps/mach-pki"

[dep.tls]
path = "../../deps/mach-tls"

[dep.http]
path = "../../deps/mach-http"

[target.linux-x86_64]
isa = "x86_64"
os = "linux"
abi = "sysv64"

[artifact.dns-proxy]
kind = "bin"
entry = "dns_proxy.mach"
out = "dns-proxy"
targets = ["machos"]
link = []
need = []
