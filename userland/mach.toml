# the programs in MachOS's /bin, built on mach's std (the low-level ones that
# need MachOS's own calls use the SDK's abi); tools/programs.sh keeps the
# [artifact.*] tables in step with src/bin
[project]
id = "userland"
version = "0.1.0"
mach = "^6.10"
src = "src"
out = "out/{target.name}/{profile.name}"

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = false
float_reassoc = false

# a MachOS program: a static x86_64 ELF linked at 4 MiB. `platform` is what
# selects std's MachOS layer
[target.machos]
isa      = "x86_64"
os       = "freestanding"
abi      = "sysv64"
of       = "elf"
base     = 0x400000
platform = "machos"

[dep.sdk]
path = "../sdk"

# std with its MachOS layer, until mach-std has a way to add one from outside
[dep.std]
git = "git@github.com:Wmakes/machos-std.git"
ref = "branch/machos"

# programs (generated by tools/programs.sh)

[artifact.adduser]
kind = "bin"
entry = "bin/adduser.mach"
out = "bin/adduser"
targets = ["machos"]
link = []
need = []

